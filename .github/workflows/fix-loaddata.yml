name: Repair missing loadData

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch App.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/App.jsx')
          s = p.read_text()
          if 'const loadData = async () =>' not in s:
              marker = "  const showToastMsg = (msg, type = 'success') => {"
              fn = '''  const loadData = async () => {
            try {
              setLoading(true);
              const res = await fetch('/api/sports');
              if (!res.ok) throw new Error(`Failed to load sports: ${res.status}`);
              const data = await res.json();
              setSports(data.sports || []);
              setWeekInfo(data.weekInfo || null);
              setStats(data.stats || null);
            } catch (err) {
              console.error('Failed to load sports data:', err);
              showToastMsg('Failed to load sports data', 'error');
            } finally {
              setLoading(false);
            }
          };

'''
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              p.write_text(s.replace(marker, fn + marker, 1))
              print('loadData inserted')
          else:
              print('loadData already present')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/App.jsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix undefined loadData in App.jsx'
            git push
          fi
